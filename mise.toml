[tasks.fe]
description = "Start the Next.js frontend dev server"
dir = "frontend"
run = "npm run dev"

[tasks.app]
description = "Start the app (database + backend) via Docker Compose"
run = "docker compose up"

[tasks."app:build"]
description = "Rebuild and start the app (database + backend) via Docker Compose"
run = "docker compose up --build"

[tasks."app:down"]
description = "Stop app containers (database + backend)"
run = "docker compose down"

[tasks."prettier:fix"]
description = "Format all frontend files with Prettier"
dir = "frontend"
run = "npx prettier --write \"src/**/*.{ts,tsx,css,json}\""

[tasks."prettier:check"]
description = "Check frontend formatting with Prettier"
dir = "frontend"
run = "npx prettier --check \"src/**/*.{ts,tsx,css,json}\""
